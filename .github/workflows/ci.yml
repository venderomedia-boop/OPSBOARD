name: OPSBOARD CI

on:
  pull_request:
    branches:
      - main

concurrency:
  group: opsboard-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build, self-tests, and browser E2E
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Email Intake self-tests
        run: npm run test:email-intake

      - name: Build
        run: npm run build

      - name: Email Intake browser E2E
        run: npm run test:e2e
        env:
          EMAIL_INTAKE_TEST_MODE: "1"

      - name: Upload Playwright report and screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: email-intake-playwright-${{ github.run_attempt }}
          path: |
            playwright-report/
            test-results/
          if-no-files-found: warn
          retention-days: 14
