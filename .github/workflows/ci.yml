name: OPSBOARD CI

on:
  pull_request:
    branches:
      - main

concurrency:
  group: opsboard-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and workflow self-tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package.json

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Email Intake self-tests
        run: npm run test:email-intake

      - name: Build
        run: npm run build
